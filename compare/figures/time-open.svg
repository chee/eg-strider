<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 656" font-family="Helvetica, Arial, sans-serif">
<rect width="750" height="656" fill="white"/>
<text x="120" y="20" font-size="16" font-weight="bold">Reopen time</text>
<text x="120" y="36" font-size="10" fill="#444">From the bytes of a saved document (using each library's native format) until it is ready for more edits, with all parsing counted.</text>
<text x="120" y="49" font-size="10" fill="#444">eg-strider and Loro leave the history unread until an edit needs it. diamond-types has no saved document that skips the merge, so it is</text>
<text x="120" y="62" font-size="10" fill="#444">given what the paper uses: its history file beside a copy of the text.</text>
