<text x="120" y="20" font-size="16" font-weight="bold">Merge time</text>
<text x="120" y="36" font-size="10" fill="#444">From the bytes of each library's own encoding of a whole history until the merged text is read, with all decoding counted. eg-strider</text>
<text x="120" y="49" font-size="10" fill="#444">and diamond-types replay their event graph from nothing; Yjs, Loro (from its updates) and Automerge integrate their CRDT ops.</text>
