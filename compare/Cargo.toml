[package]
name = "compare"
description = "Checks eg-strider against diamond-types, and measures both and Loro side by side"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
eg-strider = { path = "../crates/eg-strider" }
# The implementation of Eg-walker that the paper benchmarked: the reference for both
# correctness and speed. Pinned to the latest commit of its own repository, which is a
# little faster than the copy in the paper's artifact.
diamond-types = { git = "https://github.com/josephg/diamond-types", rev = "89ae3a0ab8d941a2885e6ec89d094bc9ce9d2922" }
# The rope diamond-types keeps a document's text in, and what compresses its saved text.
jumprope = "1.1"
zstd = "0.13"
loro = "1.16.2"
automerge = "0.12.0"
# Makes the Automerge changes that the benchmark applies with the version above. From 0.7 on,
# applying a few changes walks every op in the document, so making the concurrent traces,
# each writer taking in the others' changes as it goes, does not finish.
automerge_replay = { package = "automerge", version = "0.6.1" }
# Automerge's hashless branch, which reworks how changes are stored and loaded.
automerge_hashless = { package = "automerge", git = "https://github.com/automerge/automerge", rev = "7046d39dd5d9064c91ea7eae1016199de94dcaf2" }
yrs = "0.28.0"
# Reads the paper's editing traces, which are JSON.
serde_json = "1"

[dev-dependencies]
proptest.workspace = true
